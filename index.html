<title>قالب شاشتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap">
<style>
/* Layout: one phone-width app column, stacked screens, fixed bottom tab bar, full-screen player overlay */
:root{
  --bg:#16212c; --surface:#1e2b38; --surface2:#26364a; --nav:#1a2632; --line:#2b3b4d;
  --fg:#ffffff; --muted:#8fa1b5; --accent:#ff3b1f; --accent2:#ff6a2b; --gold:#ffc21a;
  --font:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif; --display:"Playfair Display",Georgia,serif;
  color-scheme:dark;
}
.app.light{ --bg:#f2f4f7; --surface:#ffffff; --surface2:#e6ebf1; --nav:#ffffff; --line:#dde3ea; --fg:#14202b; --muted:#5d6e80; }
html,body{height:100%}
body{background:#0d141b;color:var(--fg);font-family:var(--font);margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}
.app{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--bg);color:var(--fg);overflow:hidden;direction:rtl}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:80px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg)}
.topbar h1{font-size:17px;margin:0;font-weight:800;flex:1}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px}
.logo i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd36a,var(--gold) 45%,#e08a00);display:grid;place-items:center}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
/* hero */
.hero{position:relative;margin:4px 0 0;}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:0 16px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;aspect-ratio:16/9;border-radius:10px;scroll-snap-align:center;position:relative;overflow:hidden}
.slide .pt{font-size:30px}
.watch{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));color:#fff;font-weight:700;font-size:13px;padding:6px 16px;border-radius:999px;box-shadow:0 4px 14px #ff3b1f55}
.slide .watch{position:absolute;bottom:12px;right:12px}
.dots{display:flex;justify-content:center;gap:5px;margin:10px 0 2px}
.dots b{width:6px;height:6px;border-radius:3px;background:#3a4c60;transition:.25s}
.dots b.on{width:16px;background:var(--accent)}
/* rows */
.sec{margin-top:18px}
.sechead{display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin-bottom:8px}
.sechead h2{font-size:15px;margin:0;font-weight:800}
.sechead button{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:0 0 108px;text-align:right}
.poster{position:relative;width:100%;aspect-ratio:2/3;border-radius:8px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.poster .pt,.slide .pt{position:relative;font-family:var(--display);font-weight:900;color:#fff;text-align:center;line-height:.95;text-shadow:0 2px 10px #0008;letter-spacing:.5px;padding:0 6px 14%;text-transform:uppercase}
.poster .pt{font-size:15px}
.slide .pt{position:absolute;top:18%;left:0;right:0;padding:0}
.glow{position:absolute;inset:0}
.meta{margin-top:6px}
.badges{display:flex;gap:4px;align-items:center;font-size:10px;color:var(--muted)}
.imdb{background:var(--gold);color:#000;font-weight:800;font-size:8.5px;padding:0 3px;border-radius:2px;line-height:13px}
.ctitle{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.csub{font-size:10.5px;color:var(--muted)}
.continue .card{flex-basis:170px}
.continue .poster{aspect-ratio:16/9}
.prog{height:3px;background:#ffffff30;border-radius:2px;margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
/* bottom nav */
.nav{position:absolute;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--nav);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.nav button.on{color:var(--fg)}
.nav button.on svg{filter:drop-shadow(0 0 6px #ffffff40)}
/* details */
.dhero{position:relative;aspect-ratio:3/4;overflow:hidden}
.dhero .poster{position:absolute;inset:0;border-radius:0;aspect-ratio:auto}
.dhero .poster .pt{font-size:44px;padding-bottom:62%}
.dhero::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,var(--bg) 92%)}
.dtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;padding:10px 12px;gap:8px}
.dtop .ttl{flex:1;font-weight:700;font-size:14px;text-shadow:0 1px 4px #000}
.dinfo{position:relative;z-index:2;margin-top:-120px;padding:0 16px;text-align:center}
.dinfo .badges{justify-content:center;font-size:11.5px;color:#d2dbe5}
.dinfo .sub{font-size:12.5px;margin:4px 0 10px;font-weight:600}
.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
.act{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;width:72px;color:#e3eaf2}
.actions .watch{padding:9px 28px;font-size:14px}
.tvline{display:flex;justify-content:space-between;align-items:center;margin:14px 16px 6px;font-size:12px}
.tag{border:1px solid var(--muted);padding:0 5px;border-radius:3px;font-size:10px;color:var(--muted)}
.trailer{display:flex;align-items:center;gap:6px;font-weight:700}
.desc{padding:0 16px;font-size:12.5px;line-height:1.75;color:#c9d4df}
.app.light .desc{color:var(--muted)}
.desc button{color:var(--muted);font-weight:700;font-size:12px}
.likes{display:flex;gap:16px;padding:8px 16px;font-size:12px;color:var(--muted)}
.likes button{display:flex;align-items:center;gap:4px}
.likes button.on{color:var(--gold)}
.pill{border:1.5px solid var(--fg);border-radius:999px;padding:2px 14px;font-size:12px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.eps{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.ep{display:flex;align-items:center;gap:10px}
.ep .thumb{position:relative;width:132px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none}
.playc{position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 3px 10px #0007}
.ep .info{flex:1;min-width:0}
.ep .info b{display:block;font-size:13px}
.ep .info small{color:var(--muted);font-size:11px}
.ep .eprog{height:3px;background:#ffffff25;margin-top:5px;border-radius:2px;overflow:hidden}
.ep .eprog i{display:block;height:100%;background:var(--accent)}
.dl{width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.dl.done{color:var(--gold)}
.wide{display:block;margin:12px 16px 0;width:calc(100% - 32px);background:var(--surface2);border-radius:6px;padding:7px;font-size:12.5px;font-weight:700;text-align:center}
.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:0 16px}
.person{text-align:center;font-size:10.5px;font-weight:700;line-height:1.25}
.av{width:54px;height:54px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;background:var(--surface2);overflow:hidden}
.person small{display:block;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;padding:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;padding:0 16px}
.grid3 .card,.grid2 .card{flex:none}
/* categories */
.coll{display:flex;align-items:center;gap:12px;padding:6px 16px}
.coll .poster{width:62px;aspect-ratio:1;flex:none}
.coll .poster .pt{font-size:8px}
.coll b{font-size:13px;flex:1}
.coll small{color:var(--muted);font-size:11px}
.cat{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;display:flex;align-items:flex-end;padding:8px;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 6px #000}
/* search */
.sbar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:999px;padding:0 12px;height:40px;flex:1}
.sbar input{flex:1;background:none;border:0;color:var(--fg);font-size:13px;outline:none;min-width:0}
.sbar input::placeholder{color:var(--muted)}
.fbtn{width:28px;height:28px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;margin:4px 16px 0}
.result{display:flex;gap:10px;padding:8px 16px;align-items:center}
.result .poster{width:56px;flex:none}
.result .poster .pt{font-size:7px}
.result .ri{flex:1;min-width:0}
.result b{font-size:13.5px;display:block}
.result small{color:var(--muted);font-size:11px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px}
.chip{background:var(--surface2);border-radius:999px;padding:3px 12px;font-size:12px}
.empty{text-align:center;padding:60px 30px;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--fg);font-size:15px;margin:8px 0 2px}
/* sheets */
.scrim{position:absolute;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg);border-radius:14px 14px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-size:16px;flex:1}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.inp{width:100%;background:var(--surface2);border:0;border-radius:4px;color:var(--fg);padding:9px 10px;font-size:13px}
.two{display:flex;gap:10px;align-items:center}
.two span{color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:#fff}
.gold{width:100%;background:var(--gold);color:#111;font-weight:800;border-radius:6px;padding:11px;font-size:14px}
.outline{border:1.5px solid var(--fg);border-radius:6px;padding:3px 12px;font-size:12px;font-weight:700}
/* account */
.acc-top{text-align:center;padding:14px 16px 18px;border-bottom:1px solid var(--line)}
.acc-top b{font-size:15px;display:block}
.acc-top p{margin:2px 0 12px;color:var(--muted);font-size:12px}
.whitebtn{background:#fff;color:#111;font-weight:800;border-radius:999px;padding:8px 40px;font-size:13px}
.list button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.list button svg{color:var(--muted)}
.holo{margin:16px;border-radius:12px;aspect-ratio:2.2/1;background:linear-gradient(115deg,#f7a6d9,#b8a8ff 25%,#86e3ff 45%,#fff2a8 65%,#ffb36b 85%);display:grid;place-items:center;color:#1b1b2b;font-weight:800;font-size:20px;position:relative;overflow:hidden}
.holo::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 48%,transparent 62%);animation:shine 4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.ver{text-align:center;color:var(--muted);font-size:11px}
.tabs{display:flex;gap:6px;padding:4px 16px}
.tabs button{padding:3px 14px;border-radius:4px;font-size:12px;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:#111}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13.5px;font-weight:700}
.setlbl{padding:12px 16px 2px;font-size:13px;color:var(--muted);font-weight:700}
.seg{display:flex;background:var(--surface2);border-radius:6px;padding:2px}
.seg button{padding:4px 14px;border-radius:5px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:#111}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#000d;color:#fff;font-size:12.5px;padding:7px 16px;border-radius:999px;z-index:90;white-space:nowrap;pointer-events:none;transition:opacity .25s}
/* PLAYER */
.player{position:absolute;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden;user-select:none;touch-action:none}
.player.land .stage{position:absolute;width:var(--h);height:var(--w);top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg)}
.stage{position:absolute;inset:0}
.stage canvas,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.player:not(.land) .stage canvas,.player:not(.land) .stage video{top:50%;height:auto;aspect-ratio:16/9;transform:translateY(-50%)}
.ui{position:absolute;inset:0;transition:opacity .25s;background:linear-gradient(#000a,transparent 22%,transparent 72%,#000c)}
.ui.off{opacity:0;pointer-events:none}
.ptop{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top,0px)) 14px;gap:10px}
.ptop .t{flex:1;text-align:right}
.ptop .t b{font-size:16px;display:block}
.ptop .t small{font-size:11.5px;opacity:.85}
.ptop .ic{display:flex;gap:12px}
.mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:26px;direction:ltr}
.pp{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--accent);background:#0006}
.pbot{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));direction:ltr}
.pbot .bar{display:flex;align-items:center;gap:10px;font-size:11.5px;font-variant-numeric:tabular-nums}
.track{flex:1;height:22px;display:flex;align-items:center;cursor:pointer;position:relative}
.track .rail{position:absolute;left:0;right:0;height:3px;background:#ffffff40;border-radius:2px}
.track .buf{position:absolute;left:0;height:3px;background:#ffffff60;border-radius:2px}
.track .fill{position:absolute;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--accent2));border-radius:2px}
.track .knob{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 0 4px #ffc21a33}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;direction:rtl}
.prow button{font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center;background:#ffffff1a;border-radius:999px;padding:4px 12px}
.wm{position:absolute;right:14px;bottom:70px;font-weight:800;font-size:12px;letter-spacing:1px;opacity:.45;display:flex;align-items:center;gap:4px;pointer-events:none}
.seekfx{position:absolute;top:0;bottom:0;width:40%;display:grid;place-items:center;font-weight:800;font-size:15px;pointer-events:none;opacity:0;transition:opacity .3s}
.seekfx.l{left:0;background:radial-gradient(ellipse at left,#ffffff22,transparent 70%)}
.seekfx.r{right:0;background:radial-gradient(ellipse at right,#ffffff22,transparent 70%)}
.seekfx.show{opacity:1}
.gauge{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:130px;border-radius:17px;background:#0009;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:8px 0;gap:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.gauge.show{opacity:1}
.gauge .g{width:4px;flex:1;background:#ffffff30;border-radius:2px;position:relative;overflow:hidden}
.gauge .g i{position:absolute;bottom:0;left:0;right:0;background:#fff}
.gauge.l{left:24px}.gauge.r{right:24px}
.dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
.subs{position:absolute;left:10%;right:10%;bottom:22%;text-align:center;font-size:15px;font-weight:700;text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none}
.strip{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000e 30%);z-index:3}
.strip .row{padding:0}
.strip .ep2{flex:0 0 130px;font-size:11.5px;font-weight:700;text-align:center}
.strip .thumb{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;margin-bottom:4px;border:2px solid transparent}
.strip .ep2.on .thumb{border-color:#fff}
.lockbtn{position:absolute;left:14px;top:calc(50% - 80px);width:38px;height:38px;border-radius:50%;background:#0007;display:grid;place-items:center}
.locked .ui > :not(.lockbtn){display:none}
.menu{position:absolute;z-index:4;left:12px;top:56px;background:#1b1f25ee;border-radius:10px;min-width:220px;padding:6px 0;font-size:13px}
.menu .mh{padding:6px 14px;color:#9aa;font-size:11.5px}
.menu button{display:flex;justify-content:space-between;width:100%;padding:8px 14px;font-weight:600;text-align:right}
.menu button.on{color:var(--gold)}
.menu hr{border:0;border-top:1px solid #ffffff1a;margin:4px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.poster img,.slide img,.thumb img,.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av{position:relative}
.poster.has-img .pt,.poster.has-img .glow{display:none}
.slide .shade{position:absolute;inset:0;background:linear-gradient(90deg,#000a,transparent 65%),linear-gradient(transparent 50%,#0009)}
.slide .stitle{position:absolute;right:14px;bottom:52px;left:14px;font-weight:800;font-size:19px;text-shadow:0 2px 8px #000;color:#fff}
.sk{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:skl 1.2s infinite linear}
@keyframes skl{from{background-position:200% 0}to{background-position:-200% 0}}
.notice{margin:10px 16px;padding:10px 12px;border-radius:8px;background:var(--surface);font-size:12px;color:var(--muted);line-height:1.7}
.notice b{color:var(--fg)}
.yt{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pnote{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#000a;border-radius:999px;padding:4px 14px;font-size:11.5px;white-space:nowrap;pointer-events:none}
.attr{text-align:center;color:var(--muted);font-size:10.5px;padding:6px 24px 0;line-height:1.6}
.ep .info p{margin:2px 0 0;font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seasonlist button{display:flex;justify-content:space-between;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.seasonlist button.on{color:var(--gold)}
.dhero ~ *{position:relative;z-index:2}
.seasonlist small{color:var(--muted);font-weight:400}
</style>

<div class="app" id="app">
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-cats" hidden></section>
  <section class="screen" id="s-search" hidden></section>
  <section class="screen" id="s-account" hidden></section>
  <section class="screen" id="s-page" hidden></section>
  <nav class="nav" id="nav"></nav>
  <div id="layer"></div>
</div>

<script>
/* ---------- icons ---------- */
const I={
home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.7v9.5h5.3v-6h3v6h5.3V11h2.7z"/></svg>',
cats:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9.5 12 4l8 5.5V20H4z"/><path d="M9 12.5h6v5H9z" fill="#0004"/></svg>',
search:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>',

 if(t<6){ctx.globalAlpha=Math.min(1,(6-t)/1.5);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 56px "Playfair Display",Georgia,serif';ctx.fillText((s.lt||s.t).toUpperCase().slice(0,26),W/2,H/2);ctx.font='700 26px Cairo,sans-serif';ctx.fillText(s.mt==='movie'?s.t:`الحلقة ${P.ep}`,W/2,H/2+46);ctx.globalAlpha=1}
}
function loop(){cancelAnimationFrame(P.raf);const cv=$('#cv');const ctx=cv&&cv.getContext('2d');
 const step=ts=>{if(!$('#pl'))return;const dt=P.last?(ts-P.last)/1000:0;P.last=ts;
  if(P.video){P.t=P.video.currentTime||0;if(isFinite(P.video.duration))P.dur=P.video.duration}else if(ctx){if(P.playing)P.t=Math.min(P.dur,P.t+dt*P.speed);scene(ctx,P.t)}
  if(!P.video&&P.t>=P.dur-0.05&&P.playing){P.playing=false;syncPP();showUI(true)}
  const pct=P.dur?P.t/P.dur*100:0;$('#fill').style.width=pct+'%';$('#knob').style.left=pct+'%';
  let bufP=pct+8;if(P.video&&P.video.buffered.length)bufP=P.video.buffered.end(P.video.buffered.length-1)/P.dur*100;$('#buf').style.width=Math.min(100,bufP)+'%';

  if(Math.floor(ts/1000)!==P._sv&&P.t>1){P._sv=Math.floor(ts/1000);S.prog[P.key]={v:P.t/P.dur,ts:Date.now()};save('prog')}
  P.raf=requestAnimationFrame(step)};P.raf=requestAnimationFrame(step)}

async function loadVideo(o){
 const v=document.createElement('video');v.playsInline=true;v.setAttribute('playsinline','');v.playbackRate=P.speed;
 const old=$('#cv')||$('#cv2');old.replaceWith(v);v.id='cv2';P.video=v;
 if(o.sub){v.crossOrigin='anonymous';const tr=document.createElement('track');tr.kind='subtitles';tr.srclang='ar';tr.label='العربية';tr.src=o.sub;tr.default=true;v.appendChild(tr)}
 const at=P.t;v.onloadedmetadata=()=>{if(isFinite(v.duration))P.dur=v.duration;if(at&&at<v.duration-5)v.currentTime=at};
 v.onended=()=>{P.playing=false;syncPP();showUI(true)};v.onerror=()=>toast('تعذر تشغيل رابط الفيديو');
 try{if(/\.m3u8(\?|$)/i.test(o.src)&&!v.canPlayType('application/vnd.apple.mpegurl')){if(!window.Hls)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js');if(window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(o.src);h.attachMedia(v);P.hls=h}else v.src=o.src}else v.src=o.src}catch(e){v.src=o.src}

function bindGestures(){const st=$('#stage');let lastTap=0,drag=null;
 st.addEventListener('pointerdown',e=>{if(e.target.closest('button,.track,.menu,.strip'))return;drag={x:e.clientX,y:e.clientY,moved:false,side:null}});

  if(P.locked){showUI();return}
  const now=Date.now(),r=st.getBoundingClientRect(),pos=P.land?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;
  if(now-lastTap<300){const fwd=pos>.5;seek(P.t+(fwd?S.skip:-S.skip));flash(fwd?'r':'l',(fwd?'+':'-')+S.skip+' ث');lastTap=0;clearTimeout(st._s);return}
  lastTap=now;clearTimeout(st._s);st._s=setTimeout(()=>{const u=$('#ui');if($('#pextra').innerHTML){$('#pextra').innerHTML='';showUI();return}u.classList.contains('off')?showUI():u.classList.add('off')},280)});
 const tr=$('#track');const sk=e=>{const r=tr.getBoundingClientRect();const p=P.land?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;seek(Math.max(0,Math.min(1,p))*P.dur);showUI()};
 tr.addEventListener('pointerdown',e=>{tr.setPointerCapture(e.pointerId);sk(e);tr.onpointermove=sk});tr.addEventListener('pointerup',()=>tr.onpointermove=null);
}
